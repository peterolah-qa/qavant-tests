name: Playwright Tests

# Quality gate + publisher: runs on every push/PR and daily, and writes a
# status.json (test count, pass rate, run count) back to main so qavant.dev
# can show REAL CI metrics. The push of status.json is path-ignored below so
# it never re-triggers this workflow.
on:
  push:
    branches: [main]
    paths-ignore: ['status.json']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write   # needed to commit status.json back to the repo

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies