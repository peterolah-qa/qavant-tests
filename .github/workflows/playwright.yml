name: Playwright Tests

on:
  push:
    branches: [main]
    paths-ignore: ['status.json']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # FIX 1 — inside the container git runs as root over a workspace owned by
      # another uid, so every git command dies with "dubious ownership" and the
      # publish step silently no-ops. This is why status.json froze on 24 June.
      - name: Trust the workspace (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        run: npm test
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://qavant.dev' }}
          HOME: /root

      - name: Generate status.json
        if: always()
        run: node scripts/report-status.mjs

      # FIX 2 — no continue-on-error. A publish that cannot push must turn the
      # run red, otherwise the badge stays green while the site serves stale
      # numbers. That is the exact failure mode this suite is meant to catch.
      - name: Publish status.json to main
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "qavant-ci"
          git config user.email "ci@qavant.dev"
          git add status.json
          if git diff --staged --quiet; then
            echo "No status.json changes to publish."
            exit 0
          fi
          git commit -m "ci: update status.json [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "status.json published."
              exit 0
            fi
            echo "push attempt $i failed, retrying..."
            sleep 3
          done
          echo "::error::status.json could not be published after 3 attempts"
          exit 1

      # FIX 3 — guard against the silent freeze coming back in another form.
      - name: Assert status.json is fresh
        if: always() && github.event_name != 'pull_request'
        run: |
          node -e '
            const s = require("./status.json");
            const ageH = (Date.now() - new Date(s.lastRun)) / 3.6e6;
            console.log("status.json age:", ageH.toFixed(1), "h", "| tests:", s.passed + "/" + s.total);
            if (ageH > 1) {
              console.error("::error::status.json was not regenerated by this run");
              process.exit(1);
            }
          '

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
