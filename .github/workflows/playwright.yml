name: Playwright Tests

on:
  push:
    branches: [main]
    paths-ignore: ['status.json']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-noble
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        run: npm test
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://qavant.dev' }}
          HOME: /root

      - name: Generate status.json
        if: always()
        run: node scripts/report-status.mjs

      - name: Publish status.json to main
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "qavant-ci"
          git config user.email "ci@qavant.dev"
          git add status.json
          git diff --staged --quiet && exit 0 || git